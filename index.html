
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AquaSense - Botella inteligente</title>

  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
  </script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f8fc;
    }

    h2 {
      text-align: center;
      color: #176b87;
      padding: 10px;
    }

    model-viewer {
      width: 100%;
      height: 600px;
      background: linear-gradient(#e4f5fc, #ffffff);
    }
  </style>
</head>

<body>
  <h2>AquaSense — Botella inteligente</h2>

  <model-viewer
    src="Diseño%20AquaSense.glb"
    alt="Modelo 3D de la botella inteligente AquaSense"
    camera-controls
    auto-rotate
    touch-action="pan-y"
    shadow-intensity="1"
    exposure="1"
    ar>
  </model-viewer>
</body>
</html>
